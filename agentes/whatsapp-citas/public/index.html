<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador del agente</title>
<style>
  :root { --fondo:#efeae2; --barra:#008069; --mio:#d9fdd3; --suyo:#ffffff; --texto:#111b21; --gris:#667781; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#d1d7db; color:var(--texto); }
  .tel { max-width:480px; height:100dvh; margin:0 auto; display:flex; flex-direction:column; background:var(--fondo); }
  header { background:var(--barra); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; }
  header .foto { width:40px; height:40px; border-radius:50%; background:#fff; color:var(--barra); display:grid; place-items:center; font-size:20px; }
  header b { display:block; } header small { opacity:.85; }
  #chat { flex:1; overflow-y:auto; padding:16px 12px; display:flex; flex-direction:column; gap:6px; }
  .burbuja { max-width:82%; padding:7px 10px 8px; border-radius:8px; white-space:pre-wrap; line-height:1.35; font-size:15px; box-shadow:0 1px .5px rgba(0,0,0,.13); }
  .mio { align-self:flex-end; background:var(--mio); }
  .suyo { align-self:flex-start; background:var(--suyo); }
  .aviso { align-self:center; background:#fff8c4; color:#54656f; font-size:13px; padding:6px 10px; border-radius:8px; text-align:center; }
  .escribiendo { color:var(--gris); font-style:italic; }
  form { display:flex; gap:8px; padding:8px; background:#f0f2f5; }
  input { flex:1; border:0; border-radius:20px; padding:12px 16px; font-size:15px; }
  button { border:0; border-radius:50%; width:46px; height:46px; background:var(--barra); color:#fff; font-size:18px; cursor:pointer; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
<div class="tel">
  <header>
    <div class="foto">💅</div>
    <div><b>Salón de Uñas</b><small>Asistente virtual · simulador</small></div>
  </header>
  <div id="chat">
    <div class="aviso">Simulador del agente de citas. Escribe como si fueras una clienta, por ejemplo: "Hola, ¿cuánto cuesta el gelish?"</div>
  </div>
  <form id="forma">
    <input id="texto" autocomplete="off" placeholder="Escribe un mensaje" required>
    <button id="enviar" aria-label="Enviar">➤</button>
  </form>
</div>
<script>
  const chat = document.getElementById('chat')
  const forma = document.getElementById('forma')
  const entrada = document.getElementById('texto')
  const boton = document.getElementById('enviar')

  const guardado = (k, crear) => { try { return localStorage.getItem(k) || (crear && (localStorage.setItem(k, crear()), localStorage.getItem(k))) } catch { return crear ? crear() : null } }
  const telefono = guardado('sim-telefono', () => Math.random().toString(36).slice(2, 10))
  let clave = guardado('sim-clave')

  function burbuja(texto, clase) {
    const d = document.createElement('div')
    d.className = 'burbuja ' + clase
    d.textContent = texto
    chat.appendChild(d)
    chat.scrollTop = chat.scrollHeight
    return d
  }

  forma.addEventListener('submit', async (e) => {
    e.preventDefault()
    const texto = entrada.value.trim()
    if (!texto) return
    if (!clave) {
      clave = prompt('Clave del simulador (la que pusiste en CLAVE_SIMULADOR):') || ''
      try { localStorage.setItem('sim-clave', clave) } catch {}
    }
    burbuja(texto, 'mio')
    entrada.value = ''
    boton.disabled = true
    const espera = burbuja('escribiendo…', 'suyo escribiendo')
    try {
      const r = await fetch('/api/simulador', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-clave-simulador': clave },
        body: JSON.stringify({ telefono, texto }),
      })
      const datos = await r.json()
      if (r.status === 401) { clave = null; try { localStorage.removeItem('sim-clave') } catch {} }
      espera.className = 'burbuja suyo'
      espera.textContent = datos.respuesta || ('⚠️ ' + (datos.error || 'Error'))
    } catch {
      espera.className = 'burbuja suyo'
      espera.textContent = '⚠️ No hay conexión con el agente'
    } finally {
      boton.disabled = false
      entrada.focus()
    }
  })
</script>
</body>
</html>
